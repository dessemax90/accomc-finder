<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACCOMC 2026 - Lodging Finder</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #2563eb;
      --bg: #ffffff;
      --card-bg: #f8fafc;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent-green: #16a34a;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 10px;
    }

    .container { max-width: 900px; margin: 0 auto; }
    h2 { color: var(--primary); margin: 0 0 4px 0; font-size: 20px; }
    p.sub { color: var(--text-muted); font-size: 13px; margin: 0 0 16px 0; }

    .filter-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .filter-btn {
      background: #f1f5f9;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }

    .hotel-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hotel-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }

    .hotel-name { font-weight: bold; font-size: 14px; color: var(--text); }
    .badge { background: #e0f2fe; color: #0369a1; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 10px; white-space: nowrap; }
    .hotel-price { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }
    .price-highlight { color: var(--accent-green); font-weight: bold; }
    
    .book-btn {
      display: block;
      text-align: center;
      background: var(--primary-light);
      color: white;
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
    }
    .book-btn:hover { background: var(--primary); }
  </style>
</head>
<body>

<div class="container">
  <h2>🏨 Accommodation Options</h2>
  <p class="sub">Smithton (Conference Venue) & Stanley (20 min coastal drive)</p>

  <div class="filter-group" id="hotelFilters">
    <button class="filter-btn active" onclick="filterHotels('All', this)">All Locations</button>
    <button class="filter-btn" onclick="filterHotels('Smithton', this)">Smithton</button>
    <button class="filter-btn" onclick="filterHotels('Stanley', this)">Stanley</button>
  </div>

  <div class="grid" id="hotelResults"></div>
</div>

<script>
const hotelsData = [
  {"name": "Tall Timbers Tasmania", "location": "Smithton", "rate": "$190", "total": "Special BOM Rate", "rating": 4.3, "link": "http://www.talltimbershotel.com.au/"},
  {"name": "The Bridge Hotel", "location": "Smithton", "rate": "$92", "total": "$368", "rating": 4.2, "link": "http://www.bridgebistro.goodstone.com.au/"},
  {"name": "Stanley Seaview Inn", "location": "Stanley", "rate": "$211", "total": "$844", "rating": 4.4, "link": "http://stanleyseaviewinn.com.au/"},
  {"name": "Stanley Village", "location": "Stanley", "rate": "$239", "total": "$957", "rating": 4.7, "link": "http://www.stanleyvillage.com.au/"},
  {"name": "BIG4 Tassie Getaway Parks", "location": "Stanley", "rate": "$171", "total": "$686", "rating": 4.6, "link": "http://www.tassiegetawayparks.com.au/stanley"},
  {"name": "Hanlon Guest House", "location": "Stanley", "rate": "$160", "total": "$640", "rating": 4.6, "link": "http://www.hanlonguesthouse.com.au/"},
  {"name": "Rosebank Cottage Collection", "location": "Smithton", "rate": "$185", "total": "$740", "rating": 4.9, "link": "https://rosebankcottages.com/"},
  {"name": "Bilbos Cottage at Little Bird", "location": "Smithton", "rate": "$174", "total": "$696", "rating": 4.7, "link": "https://www.booking.com/hotel/au/bilbos-cottage-at-little-bird.en-gb.html"}
];

function filterHotels(loc, btnElement) {
  if (btnElement) {
    document.querySelectorAll('#hotelFilters .filter-btn').forEach(b => b.classList.remove('active'));
    btnElement.classList.add('active');
  }

  const container = document.getElementById('hotelResults');
  container.innerHTML = '';
  const filtered = loc === 'All' ? hotelsData : hotelsData.filter(h => h.location === loc);

  filtered.forEach(h => {
    const linkBtn = h.link ? `<a href="${h.link}" target="_blank" class="book-btn">View Accommodation →</a>` : '<span style="font-size:11px; color:#94a3b8; text-align:center;">Direct Booking Only</span>';
    
    container.innerHTML += `
      <div class="hotel-card">
        <div>
          <div class="hotel-header">
            <div class="hotel-name">${h.name}</div>
            <div class="badge">${h.location}</div>
          </div>
          <div class="hotel-price">
            Rate: <span class="price-highlight">${h.rate} / night</span> (${h.total})<br>
            Rating: ⭐ ${h.rating || 'N/A'}
          </div>
        </div>
        ${linkBtn}
      </div>
    `;
  });
}

filterHotels('All', null);
</script>
</body>
</html>
